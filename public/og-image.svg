<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="200" y1="200" x2="1000" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B48A1E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <circle cx="600" cy="315" r="420" fill="url(#glow)"/>

  <!-- Subtle border frame -->
  <rect x="32" y="32" width="1136" height="566" rx="16" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Emblem / Coin -->
  <circle cx="600" cy="185" r="46" fill="#0F0F0F" stroke="url(#goldGradient)" stroke-width="3"/>
  <text x="600" y="202" text-anchor="middle" fill="url(#goldGradient)" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">$</text>

  <!-- Main Title -->
  <text x="600" y="315" text-anchor="middle" fill="url(#goldGradient)" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="4">
    ONE DOLLAR PROJECT
  </text>

  <!-- Slogan -->
  <text x="600" y="382" text-anchor="middle" fill="#E5E7EB" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="3">
    ONE DOLLAR. ONE DREAM. MILLIONS OF POSSIBILITIES.
  </text>

  <!-- Footer Tag -->
  <rect x="440" y="445" width="320" height="44" rx="22" fill="#D4AF37" fill-opacity="0.12" stroke="#D4AF37" stroke-opacity="0.4"/>
  <text x="600" y="473" text-anchor="middle" fill="#FDE047" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1.5">
    DONATIONS &amp; PORTFOLIO
  </text>
</svg>
